name: Terraform

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate ${{ matrix.working-directory }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        working-directory:
          - examples/aws/budget-alert
          - examples/aws/ec2-bastion
          - examples/aws/ec2-instances
          - examples/aws/efs-file-system
          - examples/aws/s3-private-bucket
          - examples/aws/vpc-basic
          - examples/rosa/account-roles
          - examples/rosa/cluster
          - examples/rosa/machine-pool

    defaults:
      run:
        working-directory: ${{ matrix.working-directory }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.10.5

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize
        run: terraform init -backend=false

      - name: Validate
        run: terraform validate
